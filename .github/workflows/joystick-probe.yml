name: Joystick probe

# Builds the standalone joystick diagnostic tool for Windows.
on:
  push:
    paths:
      - 'tools/joystick-probe/**'
      - '.github/workflows/joystick-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release --locked --manifest-path tools/joystick-probe/Cargo.toml

      - name: Collect files
        shell: bash
        run: |
          mkdir dist
          cp tools/joystick-probe/target/release/joystick-probe.exe tools/joystick-probe/README.md dist/

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: joystick-probe
          path: dist/
          if-no-files-found: error
